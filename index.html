<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amharic Bible Quiz Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="quiz-container">
        <div id="timer-container">
            <svg class="timer-svg" width="60" height="60">
                <circle class="timer-circle-bg" cx="30" cy="30" r="28"></circle>
                <circle class="timer-circle-prog" cx="30" cy="30" r="28"></circle>
            </svg>
            <div id="timer-text">15</div>
        </div>
        <div id="progress-wrapper">
            <div id="progress-bar"></div>
        </div>
        <div id="quiz-content"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
